# Test de app bij elke push en pull request.
# Bij een push naar main (of met de hand gestart) wordt de app daarna
# gepubliceerd op GitHub Pages.

name: Testen en publiceren

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: testen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: publicatie
        uses: actions/deploy-pages@v4
